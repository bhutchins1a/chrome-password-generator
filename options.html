<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Password Generator Options</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
        max-width: 400px;
      }
      label {
        display: block;
        margin-top: 12px;
      }
      input[type="number"] {
        width: 60px;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Password Generator Settings</h2>

    <label>
      Length (10–20):
      <input id="length" type="number" min="10" max="20" />
    </label>

    <label>
      <input id="autoInsert" type="checkbox" />
      Auto-insert into focused field
    </label>

    <div id="status"></div>

    <button id="save">Save</button>

    <script src="options.js"></script>
  </body>
</html>
